<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada – Qualita Design</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; background: #f7f4f2; color: #444;
         font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .logo { display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; background: #e31e2d;
          color: #fff; font: 600 40px/1 "Poppins", Arial, sans-serif; border-radius: 2px; text-decoration: none; }
  h1 { font: 600 28px/1.3 "Poppins", Arial, sans-serif; color: #222; margin: 28px 0 10px; }
  p { margin: 0 0 28px; color: #888; font-size: 16px; }
  .btn { display: inline-block; background: #f25454; color: #fff; text-decoration: none; padding: 12px 26px;
         border-radius: 3px; font: 600 12px/1 "Poppins", Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase; }
  .btn:hover { background: #e04343; }
</style>
</head>
<body>
  <main>
    <a class="logo" href="/" aria-label="Qualita Design – início">Q</a>
    <h1>Página não encontrada</h1>
    <p>O endereço que você acessou não existe ou foi removido.</p>
    <a class="btn" href="/">Voltar para o início</a>
  </main>

</html>
